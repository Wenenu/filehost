# Cloudflare Tunnel config for the upload server.
# Generated by setup-tunnel.bat (it fills in credentials-file with your tunnel ID).
# You can also run: cloudflared tunnel login && cloudflared tunnel create upload
#   && cloudflared tunnel route dns upload upload.wested.lol

tunnel: upload
credentials-file: C:\Users\YOU\.cloudflared\PASTE_TUNNEL_ID.json

ingress:
  - hostname: upload.wested.lol
    service: http://localhost:3000
  # SSH access for remote admin (protected by a Cloudflare Access app)
  - hostname: ssh-upload.wested.lol
    service: ssh://localhost:22
  # catch-all rule (required) - everything else gets a 404
  - service: http_status:404